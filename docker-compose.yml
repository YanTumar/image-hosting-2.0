services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./images:/app/images
      - ./logs:/app/logs
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.25
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./images:/app/images
      - ./static:/usr/share/nginx/html
    depends_on:
      - app

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: images_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d images_db"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  db_data: